<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link href="./gilroy/stylesheet.css" rel="stylesheet" />
    <link rel="stylesheet" href="styles/main.css" />
  </head>
  <body>
    <section id="catalog" class="catalog">
      <div class="catalog-container">
        <h2 class="catalog-section-title">Catalog</h2>
        <ul class="catalog-list">
          <li class="catalog-list-item">
            <img
              src="./images/watch1.png"
              srcset="./images/watch1.png 1x, ./images/watch1@2x.png 2x"
              alt="Garmin Fenix 7X Pro Sapphire Solar"
              class="catalog-watch-image"
              width="208"
            />
            <p class="catalog-watch-name">Garmin Fenix 7X Pro Sapphire Solar</p>
            <p class="catalog-watch-cost">€500</p>
          </li>
          <li class="catalog-list-item">
            <img
              src="./images/watch2.png"
              srcset="./images/watch2.png 1x, ./images/watch2@2x.png 2x"
              alt="Garmin Marq Athlete"
              class="catalog-watch-image"
              width="208"
            />
            <p class="catalog-watch-name">Garmin Marq Athlete</p>
            <p class="catalog-watch-cost">€450</p>
          </li>
          <li class="catalog-list-item">
            <img
              src="./images/watch3.png"
              srcset="./images/watch3.png 1x, ./images/watch3@2x.png 2x"
              alt="Garmin Descent MK1"
              class="catalog-watch-image"
              width="208"
            />
            <p class="catalog-watch-name">Garmin Descent MK1</p>
            <p class="catalog-watch-cost">€680</p>
          </li>
          <li class="catalog-list-item">
            <img
              src="./images/watch4.png"
              srcset="./images/watch4.png 1x, ./images/watch4@2x.png 2x"
              alt="Garmin D2 Delta PX"
              class="catalog-watch-image"
              width="208"
            />
            <p class="catalog-watch-name">Garmin D2 Delta PX</p>
            <p class="catalog-watch-cost">€380</p>
          </li>
          <li class="catalog-list-item show-more">
            <img
              src="./images/watch3.png"
              srcset="./images/watch3.png 1x, ./images/watch3@2x.png 2x"
              alt="Garmin Fenix 6 Pro Solar"
              class="catalog-watch-image"
              width="208"
            />
            <p class="catalog-watch-name">Garmin Fenix 6 Pro Solar</p>
            <p class="catalog-watch-cost">€400</p>
          </li>
          <li class="catalog-list-item show-more">
            <img
              src="./images/watch4.png"
              srcset="./images/watch4.png 1x, ./images/watch4@2x.png 2x"
              alt="Tube Watch S42 Date Steel With Black Case"
              class="catalog-watch-image"
              width="208"
            />
            <p class="catalog-watch-name">Tube Watch S42 Date Steel With Black Case</p>
            <p class="catalog-watch-cost">€395</p>
          </li>

          <button class="catalog-show-more-button">Show more</button>
        </ul>
      </div>
    </section>
  </body>
</html>
